name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1" # weekly: advisories change without code changes
  workflow_dispatch:
    inputs:
      run_golden:
        description: Run GPU golden frame check (Vulkan; optional self-hosted runner)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # EDT-C4 step 1 — Rust workspace checks (no GPU).
  engine:
    name: engine
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace
      - name: file size limits
        run: python scripts/check_file_sizes.py
      - name: docs/CRATES.md up to date
        run: python scripts/gen_crates_doc.py --check

  # EDT-C4 step 2 — headless editor path (validate → import → cook).
  # Gated: `redox_cook validate`, `import`, and `cook` land with EDT-B8 / EDT-C1.
  # Coordinator: set `if: true` (or drop the condition) after those slices merge.
  editor-pipeline:
    name: editor-pipeline
    if: false
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SAMPLE_PROJECT: crates/redox_editor/tests/data/sample_project
      SAMPLE_BROKEN: crates/redox_editor/tests/data/sample_project_broken
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: sample_project validate (expect success)
        run: cargo run -p redox_cook -- validate "${{ env.SAMPLE_PROJECT }}" --json "${{ env.SAMPLE_PROJECT }}/validate.json"
      - name: sample_project import
        run: cargo run -p redox_cook -- import "${{ env.SAMPLE_PROJECT }}"
      - name: sample_project cook (profile default)
        run: cargo run -p redox_cook -- cook "${{ env.SAMPLE_PROJECT }}" --profile default --json "${{ env.SAMPLE_PROJECT }}/cook_report.json"
      - name: sample_project_broken validate (expect failure)
        shell: pwsh
        run: |
          cargo run -p redox_cook -- validate $env:SAMPLE_BROKEN --json "$env:SAMPLE_BROKEN/validate.json"
          if ($LASTEXITCODE -eq 0) {
            Write-Error "expected non-zero exit from validate on broken sample"
            exit 1
          }
          exit 0
      - name: upload editor reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-pipeline-reports
          path: |
            crates/redox_editor/tests/data/sample_project/validate.json
            crates/redox_editor/tests/data/sample_project/cook_report.json
            crates/redox_editor/tests/data/sample_project_broken/validate.json

  # EDT-C4 step 3 — GPU golden frames; never required on PR (workflow_dispatch only).
  golden-gpu:
    name: golden-gpu
    if: github.event_name == 'workflow_dispatch' && inputs.run_golden == true
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: golden frames (skinned_demo)
        run: pwsh -File scripts/ci_golden.ps1

  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  miri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: Miri (ECS storage; rayon and trybuild tests are skipped)
        run: cargo miri test -p redox_ecs --lib --test ownership --test commands --test property --test ecs_tests -- --skip compile_fail --skip par_iter
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
          PROPTEST_CASES: "4"

  docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2