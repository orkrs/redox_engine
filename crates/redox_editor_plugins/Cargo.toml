[package]
name = "redox_editor_plugins"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Native cdylib loading (ABI stub; dlopen not enabled by default — see `native.rs`).
editor-native-plugins = []

[dependencies]
redox_editor_core = { path = "../redox_editor_core" }
redox_editor_assets = { path = "../redox_editor_assets" }

[dev-dependencies]
redox_reflect = { path = "../redox_reflect" }