[package]
name = "redox_asset"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# In-memory KTX2 builder (`redox_asset::testing`) for tests of other crates.
testing = []
# Basis Universal (UASTC / ETC1S) transcoding; builds the C++ transcoder.
basis = ["dep:basis-universal"]
default = ["basis"]

[dependencies]
redox_ecs = { path = "../redox_ecs" }
image = { workspace = true }
gltf = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
notify = { workspace = true }
flume = { workspace = true }
ron = { workspace = true }
uuid = { version = "1", features = ["v4"] }
lz4_flex = "0.14"
ktx2 = "0.5"
ruzstd = "0.9"
basis-universal = { version = "0.3", optional = true }

[dev-dependencies]
zstd = "0.14"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "ktx2"
harness = false
