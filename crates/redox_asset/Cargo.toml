[package]
name = "redox_asset"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# In-memory KTX2 builder (`redox_asset::testing`) for tests of other crates.
testing = []

[dependencies]
redox_ecs = { path = "../redox_ecs" }
image = { workspace = true }
gltf = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
notify = { workspace = true }
flume = { workspace = true }
ron = { workspace = true }
uuid = { version = "1", features = ["v4"] }
lz4_flex = "0.14"
ktx2 = "0.5"
ruzstd = "0.9"

[dev-dependencies]
zstd = "0.14"
