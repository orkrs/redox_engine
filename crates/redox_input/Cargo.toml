[package]
name = "redox_input"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
default = ["gamepad"]
# Gamepad polling through gilrs.
gamepad = ["dep:gilrs"]

[dependencies]
redox_math = { path = "../redox_math" }
redox_ecs = { path = "../redox_ecs" }
winit = { workspace = true, features = ["serde"] }
serde = { workspace = true }
ron = { workspace = true }
log = { workspace = true }
gilrs = { version = "0.11", optional = true }

[dev-dependencies]
