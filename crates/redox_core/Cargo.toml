[package]
name = "redox_core"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Rebuild shader-backed passes when a .wgsl file changes (dev builds).
shader-hot-reload = ["redox_render/shader-hot-reload"]

[dependencies]
redox_math = { path = "../redox_math" }
redox_ecs = { path = "../redox_ecs" }
redox_render = { path = "../redox_render" }
redox_input = { path = "../redox_input" }
redox_asset = { path = "../redox_asset" }
redox_audio = { path = "../redox_audio" }
redox_ui = { path = "../redox_ui" }
redox_physics = { path = "../redox_physics" }

serde = { workspace = true }
ron = { workspace = true }
rayon = { workspace = true }

winit = { workspace = true }
log = "0.4"
env_logger = "0.11"
pollster = "1"
bytemuck = "1.14"
wgpu = { workspace = true }

[dev-dependencies]
redox_anim = { path = "../redox_anim" }
# Gamepad polling for the Courier example.
redox_input = { path = "../redox_input", features = ["gamepad"] }
image = { workspace = true }
gltf = { workspace = true }
# Для примеров: физика, UI, рандом, gameplay/VFX/scene
redox_physics = { path = "../redox_physics" }
redox_gameplay = { path = "../redox_gameplay" }
redox_vfx = { path = "../redox_vfx" }
redox_scene = { path = "../redox_scene" }
rapier3d = { workspace = true }
# Scripted gameplay in the Courier example (coins as a WASM module).
redox_script = { path = "../redox_script" }
wat = "1.262.0"
pollster = "1"
egui-wgpu = { workspace = true }
egui = { workspace = true }
rand = "0.10"
kira = { workspace = true }
# Для benchmark: замер памяти (RSS)
memory-stats = "1.1"
