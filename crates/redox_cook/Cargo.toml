[package]
name = "redox_cook"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# `bake-ibl`: GPU convolution of an HDR sky into KTX2 maps.
bake = ["dep:redox_render", "dep:wgpu", "dep:pollster"]

[dependencies]
redox_asset = { path = "../redox_asset", features = ["encode"] }
image = { workspace = true }
ktx2 = "0.5"
redox_render = { path = "../redox_render", optional = true }
# World cells for `bake-hlod`.
redox_scene = { path = "../redox_scene" }
wgpu = { workspace = true, optional = true }
pollster = { version = "1", optional = true }

[dev-dependencies]
redox_asset = { path = "../redox_asset", features = ["testing"] }
