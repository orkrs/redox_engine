[package]
name = "redox_editor_build"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
redox_asset = { path = "../redox_asset", features = ["encode"] }
redox_ecs = { path = "../redox_ecs" }
redox_editor_assets = { path = "../redox_editor_assets" }
redox_editor_core = { path = "../redox_editor_core" }
redox_editor_scene = { path = "../redox_editor_scene" }
redox_reflect = { path = "../redox_reflect" }
gltf = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
ron = { workspace = true }

[dev-dependencies]
redox_editor_core = { path = "../redox_editor_core" }
redox_math = { path = "../redox_math" }
redox_scene = { path = "../redox_scene" }