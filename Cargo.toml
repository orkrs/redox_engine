[workspace]
resolver = "2"
members = [
    "crates/redox_math",
    "crates/redox_ecs",
    "crates/redox_reflect",
    "crates/redox_reflect_derive",
    "crates/redox_render",
    "crates/redox_physics",
    "crates/redox_core",
    "crates/redox_input",
    "crates/redox_asset",
    "crates/redox_cook",
    "crates/redox_audio",
    "crates/redox_ui",
    "crates/redox_scene",
    "crates/redox_gameplay",
    "crates/redox_vfx",
    "crates/redox_anim",
    "crates/redox_editor_core",
    "crates/redox_editor_ui",
    "crates/redox_editor",
]

[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.lints.clippy]
# Renderer entry points and shared dispatcher types are intentionally wide.
too_many_arguments = "allow"
type_complexity = "allow"
field_reassign_with_default = "allow"
new_ret_no_self = "allow"
# Library code returns errors instead of panicking on external input.
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3


[workspace.dependencies]
glam = "0.33"
winit = "0.30"
wgpu = "30"
rapier3d = "0.36"
kira = "0.12"
rayon = "1.10"
log = "0.4"
env_logger = "0.11"
smallvec = "1.11"
crossbeam-queue = "0.3"
image = "0.25"
gltf = "1.4"
bytemuck = { version = "1.14", features = ["derive"] }
anyhow = "1.0"
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
egui_plot = "0.37"
egui_dock = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
notify = "8"
meshopt = "0.6"
flume = "0.12"
git2 = "0.21"
